name: Build Windows Application

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Remove GGUF models
        shell: pwsh
        run: |
          if (Test-Path "assets\models") {
            Get-ChildItem "assets\models" -Filter "*.gguf" |
              Remove-Item -Force
          }

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onedir `
            --windowed `
            --name "ZerBo6" `
            --icon "assets\icon.ico" `
            --add-data "assets;assets" `
            main.py

      - name: Create external model folder
        shell: pwsh
        run: |
          $modelFolder = "dist\ZerBo6\_internal\assets\models"
          New-Item -ItemType Directory -Force -Path $modelFolder
          "Place one compatible GGUF model here." |
            Set-Content "$modelFolder\PUT_MODEL_HERE.txt"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ZerBo6
          path: dist/ZerBo6/
          if-no-files-found: error
